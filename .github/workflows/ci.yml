name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  MICROPYTHON_TAG: v1.22.2

jobs:
  cpython:
    name: cpython
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # tests/test_learning_protocol.py imports numpy (via learning/); torch is not needed by the tests.
      - name: Install test dependencies
        run: python -m pip install "numpy==2.2.6"
      - name: Offline unit + sim tests
        run: python tests/run_all.py

  micropython:
    name: micropython
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      MP_DIR: ${{ github.workspace }}/../micropython
    steps:
      - uses: actions/checkout@v4

      - name: Cache MicroPython build
        id: mp-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.MP_DIR }}/mpy-cross/build/mpy-cross
            ${{ env.MP_DIR }}/ports/unix/build-standard/micropython
          key: micropython-${{ env.MICROPYTHON_TAG }}-${{ runner.os }}-ubuntu-22.04-unix-standard-v1

      - name: Install build dependencies
        if: steps.mp-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y build-essential libffi-dev pkg-config

      - name: Build MicroPython ${{ env.MICROPYTHON_TAG }} (mpy-cross + unix port)
        if: steps.mp-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$MICROPYTHON_TAG" https://github.com/micropython/micropython.git "$MP_DIR"
          make -C "$MP_DIR/mpy-cross" -j"$(nproc)"
          make -C "$MP_DIR/ports/unix" submodules
          make -C "$MP_DIR/ports/unix" -j"$(nproc)"

      - name: Expose binaries
        run: |
          echo "MICROPYTHON=$MP_DIR/ports/unix/build-standard/micropython" >> "$GITHUB_ENV"
          echo "MPY_CROSS=$MP_DIR/mpy-cross/build/mpy-cross" >> "$GITHUB_ENV"
          "$MP_DIR/ports/unix/build-standard/micropython" -c "import sys; print(sys.implementation, sys.version)"

      - name: Logic check (fsm / calib under MicroPython)
        run: |
          set -o pipefail
          MICROPYPATH=src:tests "$MICROPYTHON" tests/mpy_logic_check.py 2>&1 | tee logic.log
          if grep -q "Traceback" logic.log; then echo "::error::traceback in mpy_logic_check"; exit 1; fi
          grep -q "ALL MICROPYTHON CHECKS PASSED" logic.log || { echo "::error::missing 'ALL MICROPYTHON CHECKS PASSED'"; exit 1; }

      - name: mpy-cross compiles every src/*.py
        run: |
          fail=0
          for f in src/*.py; do
            if "$MPY_CROSS" -o /tmp/x.mpy "$f"; then echo "ok   $f"; else echo "::error file=$f::mpy-cross failed"; fail=1; fi
          done
          exit $fail

      - name: Sim check (edge)
        timeout-minutes: 22
        run: tools/ci_mpy_sim.sh edge
      - name: Sim check (full)
        timeout-minutes: 22
        run: tools/ci_mpy_sim.sh full
      - name: Sim check (demo)
        timeout-minutes: 22
        run: tools/ci_mpy_sim.sh demo

      - name: Upload sim logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: micropython-logs
          path: "*.log"
          if-no-files-found: ignore
